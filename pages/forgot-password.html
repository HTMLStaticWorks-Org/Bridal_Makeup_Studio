<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Bride Portal Password | Lumina Bridal Studio</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/misc/favicon.svg">
  <meta name="description" content="Recover access to your Lumina Bride Portal account or request a magic login link from our bridal concierge. Book your private bridal suite at Lumina Bridal...">
  <link rel="canonical" href="https://luminabridal.studio/pages/forgot-password.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reset Your Bride Portal Password | Lumina Bridal Studio">
  <meta property="og:description" content="Restore access to your private bridal makeup moodboard and booking dossier.">
  <meta property="og:image" content="../assets/images/misc/og-forgot.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="../assets/fonts/cormorant-garamond-600.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="../assets/fonts/jost-400.woff" as="font" type="font/woff" crossorigin>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- =====================================================================
       MAIN CONTENT — FORGOT PASSWORD
       ===================================================================== -->
  <main id="main-content">
    <div class="auth-floating-controls">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle Dark or Light Mode" title="Toggle Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button type="button" class="icon-btn" data-rtl-toggle aria-label="Toggle Right to Left Layout" title="Toggle RTL">RTL</button>
    </div>

    <section class="container auth-single" aria-labelledby="forgot-heading">
      <div class="surface-box auth-card">
        <div class="auth-topbar">
          <a href="index.html" class="brand-logo" aria-label="Lumina Bridal Studio Home">
            <span class="brand-monogram" aria-hidden="true"><svg class="brand-emblem" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 3C17.2 10.2 21.8 14.8 29 16C21.8 17.2 17.2 21.8 16 29C14.8 21.8 10.2 17.2 3 16C10.2 14.8 14.8 10.2 16 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9.5C16.7 13.1 18.9 15.3 22.5 16C18.9 16.7 16.7 18.9 16 22.5C15.3 18.9 13.1 16.7 9.5 16C13.1 15.3 15.3 13.1 16 9.5Z" fill="currentColor" opacity="0.28"/><circle cx="16" cy="16" r="1.8" fill="currentColor"/><circle cx="8.5" cy="8.5" r="0.9" fill="currentColor" opacity="0.85"/><circle cx="23.5" cy="8.5" r="0.9" fill="currentColor" opacity="0.85"/><circle cx="8.5" cy="23.5" r="0.9" fill="currentColor" opacity="0.85"/><circle cx="23.5" cy="23.5" r="0.9" fill="currentColor" opacity="0.85"/></svg></span>
            <span class="brand-text">
              <span class="brand-name">Lumina</span>
              <span class="brand-sub">Bridal Studio</span>
            </span>
          </a>
        </div>

        <span class="eyebrow">Account Recovery</span>
        <h1 id="forgot-heading">Restore Your Bride <span class="script-accent">Key</span></h1>
        <p class="mt-2 mb-5">Enter the email address associated with your bridal trial or wedding reservation.</p>

        <form action="login.html" method="get" data-validate data-success-message="Recovery link dispatched! Please check your bridal email inbox.">
          <div class="form-group">
            <label for="forgot-email" class="form-label">Registered Bridal Email *</label>
            <input type="email" id="forgot-email" class="form-control" placeholder="priya.sharma@luxurybride.com" required>
            <span class="form-error">Please enter your registered email address.</span>
          </div>

          <button type="submit" class="btn btn--primary w-full">Send Encrypted Reset Link</button>
        </form>

        <div class="mt-6 text-center stack-sm">
          <a href="login.html" class="btn btn--ghost w-full">← Return to Bride Login</a>
          <a href="contact.html" class="fs-sm text-primary fw-600">Need urgent help? Contact our Bridal Concierge</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../assets/js/plugins/aurelle-plugins.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
